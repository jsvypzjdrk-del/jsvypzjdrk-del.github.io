<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Tracker</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Arial, sans-serif; background: #0A0D14; color: #c7ccd6; }
  #titlebar { background: #0A0D14; color: #C9A876; padding: 14px 20px; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
  #titlebar .logo-mark { flex-shrink: 0; }
  #titlebar .brand-text { flex: 1; }
  #titlebar a { color: #0A0D14; text-decoration: none; font-size: 14px; background: #C9A876; padding: 4px 10px; border-radius: 4px; }
  #wrap { max-width: 700px; margin: 0 auto; padding: 20px 16px 60px; }

  #not-logged-in { text-align: center; padding-top: 60px; }
  #not-logged-in .primary-btn { padding: 10px 26px; font-size: 15px; font-weight: bold; border: none; background: #C9A876; color: #0A0D14; border-radius: 8px; cursor: pointer; text-decoration:none; display:inline-block; }

  #app-content { display: none; }
  #app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #app-header h2 { color: #C9A876; margin: 0; font-size: 18px; }

  #add-form {
    background: #fffdf7; border: 1px solid #ddd0b8; border-radius: 10px; padding: 16px;
    margin-bottom: 24px;
  }
  #add-form h3 { margin: 0 0 12px; font-size: 16px; color: #0A0D14; }
  #add-form label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #444; }
  #add-form input {
    width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px;
    margin-bottom: 12px;
  }
  #add-form button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none;
    background: #1e7d32; color: #fff; border-radius: 6px; cursor: pointer;
  }

  .card {
    background: #fffdf7; border: 1px solid #ddd0b8; border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-top .name { font-size: 18px; font-weight: bold; color: #0A0D14; }
  .card-top .del { color: #c92a2a; font-size: 13px; font-weight: bold; cursor: pointer; }

  .bar-bg { background: #3a3226; border-radius: 8px; height: 16px; margin: 10px 0; overflow: hidden; }
  .bar-fill { background: #1e7d32; height: 100%; }

  .stats { display: flex; justify-content: space-between; font-size: 14px; color: #444; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .stats b { color: #0A0D14; }

  .pay-row { display: flex; gap: 8px; }
  .pay-row input {
    flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px;
  }
  .pay-row button {
    padding: 10px 16px; font-size: 15px; font-weight: bold; border: none;
    background: #9c8560; color: #fff; border-radius: 6px; cursor: pointer;
  }

  #empty { text-align: center; color: #9c8560; margin-top: 40px; font-size: 15px; }
  #loading { text-align: center; color: #9c8560; margin-top: 60px; font-size: 15px; }
</style>
</head>
<body>

<div id="titlebar">
  <span class="logo-mark"><img src="logo.png" alt="Millscat" style="height:26px; width:auto;"></span>
  <span class="brand-text">Payment Tracker</span>
  <a href="index.html">&larr; Home</a>
</div>

<div id="wrap">

  <div id="loading">Loading...</div>

  <div id="not-logged-in" style="display:none;">
    <p style="color:#9c8560;">You need to log in first.</p>
    <a class="primary-btn" href="index.html">Go to home page</a>
  </div>

  <div id="app-content">
    <div id="app-header">
      <h2 id="app-title">Your Items</h2>
    </div>

    <div id="add-form">
      <h3>Add something you're paying off</h3>
      <label for="new-name">What is it?</label>
      <input id="new-name" type="text" placeholder="e.g. PS5">
      <label for="new-total">Total cost ($)</label>
      <input id="new-total" type="number" step="0.01" placeholder="900">
      <label for="new-paid">Already paid so far ($, optional)</label>
      <input id="new-paid" type="number" step="0.01" placeholder="0">
      <button onclick="addItem()">Add Item</button>
    </div>

    <div id="list"></div>
    <div id="empty">Nothing tracked yet — add something above.</div>
  </div>

</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDNOrwbMD3zcl_G-VDH1LfEe0Kv4bILLN8",
  authDomain: "millscat-tracker.firebaseapp.com",
  projectId: "millscat-tracker",
  storageBucket: "millscat-tracker.firebasestorage.app",
  messagingSenderId: "718174074085",
  appId: "1:718174074085:web:8927f197e2fbec9239d00c"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var accountId = localStorage.getItem('millscat_account_id');
var accountName = localStorage.getItem('millscat_account_name');
var items = [];

function init(){
  if(!accountId){
    document.getElementById('loading').style.display='none';
    document.getElementById('not-logged-in').style.display='block';
    return;
  }
  document.getElementById('app-title').textContent = accountName + "'s Items";
  loadItems();
}

function loadItems(){
  db.collection('payment_items').where('accountId','==',accountId).get().then(function(snapshot){
    items=[];
    snapshot.forEach(function(doc){
      var d=doc.data();
      items.push({id:doc.id, name:d.name, total:d.total, paid:d.paid});
    });
    document.getElementById('loading').style.display='none';
    document.getElementById('app-content').style.display='block';
    render();
  });
}

function addItem(){
  var name=document.getElementById('new-name').value.trim();
  var total=parseFloat(document.getElementById('new-total').value);
  var paid=parseFloat(document.getElementById('new-paid').value);
  if(!name||isNaN(total)||total<=0){alert('Please enter a name and a valid total cost.');return;}
  if(isNaN(paid)||paid<0)paid=0;

  db.collection('payment_items').add({accountId:accountId, name:name, total:total, paid:paid}).then(function(){
    document.getElementById('new-name').value='';
    document.getElementById('new-total').value='';
    document.getElementById('new-paid').value='';
    loadItems();
  });
}

function addPayment(id){
  var input=document.getElementById('pay-input-'+id);
  var amt=parseFloat(input.value);
  if(isNaN(amt)||amt<=0)return;
  var item=items.find(function(i){return i.id===id;});
  var newPaid=item.paid+amt;
  db.collection('payment_items').doc(id).update({paid:newPaid}).then(loadItems);
}

function deleteItem(id){
  if(!confirm('Remove this item?'))return;
  db.collection('payment_items').doc(id).delete().then(loadItems);
}

function render(){
  var listEl=document.getElementById('list');
  var emptyEl=document.getElementById('empty');
  listEl.innerHTML='';

  if(items.length===0){emptyEl.style.display='block';return;}
  emptyEl.style.display='none';

  items.forEach(function(item){
    var remaining=item.total-item.paid;
    if(remaining<0)remaining=0;
    var pct=Math.min(100,Math.round((item.paid/item.total)*100));

    var card=document.createElement('div');
    card.className='card';
    card.innerHTML=
      '<div class="card-top">'+
        '<span class="name">'+item.name+'</span>'+
        '<span class="del">Remove</span>'+
      '</div>'+
      '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
      '<div class="stats">'+
        '<span>Paid: <b>$'+item.paid.toFixed(2)+'</b></span>'+
        '<span>Remaining: <b>$'+remaining.toFixed(2)+'</b></span>'+
        '<span>Total: <b>$'+item.total.toFixed(2)+'</b></span>'+
      '</div>'+
      '<div class="pay-row">'+
        '<input id="pay-input-'+item.id+'" type="number" step="0.01" placeholder="Add payment amount">'+
        '<button>Add Payment</button>'+
      '</div>';

    card.querySelector('.del').onclick=function(){ deleteItem(item.id); };
    card.querySelector('.pay-row button').onclick=function(){ addPayment(item.id); };

    listEl.appendChild(card);
  });
}

init();
</script>
</body>
</html>
