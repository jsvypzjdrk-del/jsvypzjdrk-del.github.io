<!DOCTYPE html>

<title>Millscat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #0d1b2e;
    color: #c7ccd6;
    padding: 0;
    min-height: 100vh;
  }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; }
  #topbar .brand-text { font-size: 18px; letter-spacing: 0.1em; color: #c7ccd6; }
  #main-content { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 16px; }
  h1 {
    font-size: 26px; margin: 14px 0 2px; color: #c7ccd6;
    letter-spacing: 0.14em; font-weight: normal;
  }
  .tagline { font-size: 12px; color: #7891ac; letter-spacing: 0.08em; margin-bottom: 34px; }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 700px; }
  .card {
    background: #16273d; color: #c7ccd6; width: 220px; padding: 26px 18px;
    border: 1px solid #2a3d54; border-radius: 10px; text-decoration: none; display: block;
    font-size: 17px; font-weight: normal; letter-spacing: 0.03em;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #c7ccd6; }
  .card .icon-wrap { margin-bottom: 12px; }
  .card .name { display:block; }
  .card .sub { display:block; font-size: 11px; color: #7891ac; margin-top: 4px; letter-spacing: 0.05em; }
</style>
</head>
