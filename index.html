<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Millscat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #0A0D14;
    color: #C9A876;
    padding: 0;
    min-height: 100vh;
  }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; }
  #topbar .brand-text { font-size: 18px; letter-spacing: 0.1em; color: #C9A876; }
  #main-content { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 16px; }
  h1 {
    font-size: 26px; margin: 14px 0 2px; color: #C9A876;
    letter-spacing: 0.14em; font-weight: normal;
  }
  .tagline { font-size: 12px; color: #9c8560; letter-spacing: 0.08em; margin-bottom: 34px; }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 700px; }
  .card {
    background: #14181f; color: #C9A876; width: 220px; padding: 26px 18px;
    border: 1px solid #3a3226; border-radius: 10px; text-decoration: none; display: block;
    font-size: 17px; font-weight: normal; letter-spacing: 0.03em;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #C9A876; }
  .card .icon-wrap { margin-bottom: 12px; }
  .card .name { display:block; }
  .card .sub { display:block; font-size: 11px; color: #9c8560; margin-top: 4px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<div id="topbar">
  <img src="logo.png" alt="Millscat" style="height:30px; width:auto;">
  <span class="brand-text">MILLSCAT</span>
</div>

<div id="main-content">
<div class="logo-wrap">
<img src="logo.png" alt="Millscat" style="height:110px; width:auto;">
</div>
<h1>MILLSCAT</h1>
<div class="tagline">FAMILY APPS</div>

<div class="cards">

<a class="card" href="waitress_app.html">
  <span class="icon-wrap">
    <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#C9A876" stroke-width="1"/><path d="M11 22 V10 M11 10 C11 13 14 13 14 10 M23 10 V22 M17 10 C17 14 20 14 20 10 M20 14 V22" stroke="#C9A876" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  <span class="name">Little Waitress</span>
  <span class="sub">order taking game</span>
</a>

<a class="card" href="payment_tracker.html">
  <span class="icon-wrap">
    <svg width="34" height="34" viewBox="0 0 34 34"><rect x="4" y="9" width="26" height="17" rx="2" fill="none" stroke="#C9A876" stroke-width="1.3"/><line x1="4" y1="14" x2="30" y2="14" stroke="#C9A876" stroke-width="1.3"/><line x1="8" y1="20" x2="16" y2="20" stroke="#C9A876" stroke-width="1.3" stroke-linecap="round"/></svg>
  </span>
  <span class="name">Payment Tracker</span>
  <span class="sub">what's owed, what's paid</span>
</a>

<a class="card" href="learnscreen.html">
  <span class="icon-wrap">
    <svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 8 C13 5 7 5 4 7 V25 C7 23 13 23 17 26 C21 23 27 23 30 25 V7 C27 5 21 5 17 8 Z" fill="none" stroke="#C9A876" stroke-width="1.3" stroke-linejoin="round"/><line x1="17" y1="8" x2="17" y2="26" stroke="#C9A876" stroke-width="1.3"/></svg>
  </span>
  <span class="name">LearnScreen</span>
  <span class="sub">letters, words, numbers</span>
</a>

<a class="card" href="garage.html">
  <span class="icon-wrap">
    <svg width="34" height="34" viewBox="0 0 34 34"><rect x="4" y="16" width="26" height="10" rx="3" fill="none" stroke="#C9A876" stroke-width="1.3"/><path d="M7 16 L10 9 H24 L27 16" fill="none" stroke="#C9A876" stroke-width="1.3" stroke-linejoin="round"/><circle cx="10" cy="26" r="2.4" fill="none" stroke="#C9A876" stroke-width="1.3"/><circle cx="24" cy="26" r="2.4" fill="none" stroke="#C9A876" stroke-width="1.3"/></svg>
  </span>
  <span class="name">Toy Garage</span>
  <span class="sub">park the hot wheels</span>
</a>

</div>
</div>

</body>
</html>
