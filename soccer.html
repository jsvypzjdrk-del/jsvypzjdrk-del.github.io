<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Cards</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:#eceff3;color:#16233d}
  a{color:#2d6f9e}
  input,textarea{font-family:'Archivo',system-ui,sans-serif}
  .nav{background:#16233d;color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
  .brand{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase}
  .dot{width:5px;height:5px;background:#7fc3e8;transform:rotate(45deg)}
  .sub{font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.7)}
  .tabs{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:rgba(255,255,255,0.65);font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer}
  .tab.on{background:#7fc3e8;color:#16233d}
  .tab:hover{opacity:.85}
  .home{color:#7fc3e8;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;text-decoration:none;margin-left:10px}
  .wrap{padding:30px 20px 70px}
  h1{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;margin:0}
  .meta{font-size:13px;color:rgba(22,35,61,0.6);margin-top:6px}
  .head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(22,35,61,0.15)}
  .bar{flex:1;min-width:200px;max-width:420px;margin-bottom:6px;height:10px;background:#dbe1e9;overflow:hidden}
  .bar span{display:block;height:100%;background:#7fc3e8}
  .btn{border:0;background:#16233d;color:#fff;font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:11px 18px;cursor:pointer}
  .btn:hover{background:#25365c}
  .btn.ghost{background:transparent;border:2px solid #16233d;color:#16233d;padding:9px 18px}
  .btn.ghost:hover{background:rgba(22,35,61,0.06)}
  .btn.accent{background:#7fc3e8;color:#16233d}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,162px);gap:24px 20px;margin-top:26px}
  .slot{display:flex;flex-direction:column;gap:8px;cursor:pointer}
  .slot:hover{opacity:.86}
  .status{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(22,35,61,0.6)}
  .pip{width:7px;height:7px;border-radius:50%}
  .act{margin-left:auto;color:#2d6f9e}
  .panel{background:#fff;border:1px solid #cdd4de;box-shadow:0 8px 26px rgba(22,35,61,0.14)}
  .field{display:flex;flex-direction:column;gap:6px}
  .lab{font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(22,35,61,0.55)}
  .inp{border:1px solid #c3ccd8;background:#f7f9fb;padding:11px 12px;font-size:15px;color:#16233d;width:100%}
  .inp:focus{outline:2px solid #7fc3e8;outline-offset:1px}
  .opt{border:1px solid #c3ccd8;background:#f7f9fb;color:#5c6a7d;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:9px 0;cursor:pointer;flex:1}
  .opt.on{border-color:#16233d;background:#16233d;color:#fff}
  .row{display:flex;gap:6px}
  .tip{background:#f2f6fa;border-left:3px solid #7fc3e8;padding:12px 14px;font-size:12px;line-height:1.6;color:rgba(22,35,61,0.75)}
  .cols{display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start}
  .card{width:162px;height:227px;position:relative;overflow:hidden;box-sizing:border-box;box-shadow:0 3px 10px rgba(22,35,61,0.18);background:#fff;border:1px solid #cdd4de}
  .nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stack{width:420px;height:430px;position:relative;cursor:pointer;user-select:none}
  .stack .card{position:absolute;transform-origin:top left;transition:transform .22s ease,opacity .22s ease}
  .gate{max-width:420px;margin:80px auto;text-align:center}
  .ph{position:absolute;inset:0;background:#dfe4ea;background-size:cover;background-position:center}
</style>
</head>
<body>

<div class="nav">
  <span class="brand">USA</span><span class="dot"></span>
  <span class="sub" id="navsub">Card Room</span>

  <a class="home" href="index.html">&larr; Millscat</a>
</div>

<div id="app" class="wrap"></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDNOrwbMD3zcl_G-VDH1LfEe0Kv4bILLN8",

  projectId: "millscat-tracker",

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

/* Anonymous auth: every read/write below is gated on a signed-in session,
   so the Firestore rules can refuse anyone who isn't coming through this app. */
function signIn(){
  if(firebase.auth().currentUser) return Promise.resolve(firebase.auth().currentUser);
  return firebase.auth().signInAnonymously().then(function(res){ return res.user; });
}

/* This app stands on its own — the team PIN is its login.
   All docs share one fixed team key instead of a Millscat account id. */
var accountId = 'soccer_usa';


/* Team PIN gate — the PIN never travels or rests in plain text.
   The SHA-256 of the correct PIN is the only value stored here or in Firestore. */
var DEFAULT_PIN_HASH = "38813d9a6e5332787f13dac070d265339c4c711beea8b21f82966684bda30e79"; // SHA-256 of the PIN you chose
var TEAM_PIN_HASH = DEFAULT_PIN_HASH;
function sha256(text){
  var buf=new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256',buf).then(function(h){
    return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}
function pinUnlocked(){
  return sessionStorage.getItem('soccer_pin_ok')==='1';
}

var S = {
  screen:'roster', editing:null, packIndex:0, flipped:false, setupText:'',
  players:[],
  team:{ teamName:'USA', season:'U6 · Fall 2026', coach:'', assistant:'', photo:'' }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(p){ var n=(p.no==null?'':String(p.no)).trim(); return n===''?'—':n; }
function nameSize(n){ var l=String(n||'').length; return l<=13?'12px':l<=17?'10px':l<=22?'8.5px':'7px'; }
function bg(photo){ return photo ? "background-image:url('"+photo+"')" : ""; }

/* ---------- card fronts ---------- */
function front(p){
  var C='#7fc3e8', team=esc(S.team.teamName||'USA'), season=esc(S.team.season||''), nm=esc(p.name||'Player');
  var no=esc(num(p)), pos=esc(p.position||'Player'), ns=nameSize(p.name), photo=bg(p.photo);
  var d=p.design||'shield';
  var slot='<div class="ph" style="'+photo+'"></div>';

  if(d==='stripe') return ''+
   '<div style="position:absolute;inset:0;background:#16233d">'+slot+'</div>'+
   '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,36,.55) 0%,rgba(10,18,36,0) 30%,rgba(10,18,36,0) 45%,rgba(10,18,36,.75) 100%)"></div>'+
   '<div style="position:absolute;top:9px;left:9px;width:26px;height:26px;background:'+C+';display:flex;align-items:center;justify-content:center"><span style="font-family:Oswald;font-size:14px;font-weight:700;color:#16233d">'+no+'</span></div>'+
   '<div style="position:absolute;top:12px;right:10px;font-family:Oswald;font-size:9px;font-weight:700;letter-spacing:.22em;color:#fff">'+team+'</div>'+

     '<div style="display:flex;align-items:center;gap:5px;margin-top:4px"><span style="width:14px;height:2px;background:'+C+'"></span><span style="font-size:5.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75)">'+pos+' · '+season+'</span></div>'+
   '</div>';

  if(d==='night') return ''+
   '<div style="position:absolute;inset:0;background:#0e1830"></div>'+
   '<div style="position:absolute;top:0;right:0;bottom:0;width:70px;background:repeating-linear-gradient(-64deg,rgba(127,195,232,.18) 0 8px,rgba(255,255,255,0) 8px 20px)"></div>'+
   '<div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:10px">'+
     '<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:Oswald;font-size:9px;font-weight:700;letter-spacing:.24em;color:#fff">'+team+'</span><span style="font-size:5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:'+C+'">'+season+'</span></div>'+
     '<div style="margin-top:8px;height:132px;position:relative;border:2px solid '+C+';background:#1d2b4a;overflow:hidden">'+slot+'</div>'+
     '<div style="margin-top:auto;display:flex;align-items:flex-end;gap:8px">'+
       '<div style="flex:1;min-width:0"><div style="font-size:5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:'+C+'">'+pos+'</div>'+
       '<div class="nowrap" style="font-family:Oswald;font-size:'+ns+';font-weight:700;text-transform:uppercase;color:#fff;margin-top:3px">'+nm+'</div></div>'+
       '<div style="font-family:Oswald;font-size:36px;font-weight:700;line-height:.8;color:'+C+'">'+no+'</div>'+
     '</div>'+
   '</div>';

  if(d==='chevron') return ''+
   '<div style="position:absolute;top:0;left:0;right:0;height:158px;background:#1d2b4a;clip-path:polygon(0 0,100% 0,100% 84%,0 100%);overflow:hidden">'+slot+'</div>'+
   '<div style="position:absolute;top:0;left:0;right:0;height:22px;background:linear-gradient(180deg,rgba(10,18,36,.6),rgba(10,18,36,0));display:flex;align-items:center;justify-content:space-between;padding:0 9px">'+

   '<div style="position:absolute;top:132px;left:10px;width:34px;height:34px;background:'+C+';border:2px solid #fff;display:flex;align-items:center;justify-content:center"><span style="font-family:Oswald;font-size:17px;font-weight:700;color:#16233d">'+no+'</span></div>'+
   '<div style="position:absolute;left:0;right:0;bottom:14px;padding:0 10px;text-align:right">'+
     '<div class="nowrap" style="font-family:Oswald;font-size:'+ns+';font-weight:700;text-transform:uppercase;color:#16233d">'+nm+'</div>'+
     '<div style="font-size:5.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(22,35,61,.55);margin-top:3px">'+pos+'</div></div>'+
   '<div style="position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(56deg,'+C+' 0 8px,#16233d 8px 16px)"></div>';

  if(d==='deco') return ''+
   '<div style="position:absolute;inset:0;background:#12203c;padding:7px">'+
    '<div style="height:100%;border:1px solid #c9a227;padding:4px">'+
     '<div style="height:100%;border:2px solid #c9a227;display:flex;flex-direction:column;align-items:center;padding:8px 8px 9px;position:relative">'+
      '<div style="position:absolute;top:0;left:0;right:0;height:46px;background:repeating-conic-gradient(from 200deg at 50% 0%,rgba(201,162,39,.32) 0deg 3deg,rgba(0,0,0,0) 3deg 11deg)"></div>'+
      '<div style="position:relative;font-family:Oswald;font-size:8px;font-weight:700;letter-spacing:.3em;color:#c9a227">'+team+'</div>'+
      '<div style="position:relative;margin-top:7px;width:104px;height:116px;background:#1d2b4a;clip-path:path(\'M 52,0 A 52,52 0 0 1 104,52 V 116 H 0 V 52 A 52,52 0 0 1 52,0 Z\');overflow:hidden">'+slot+'</div>'+
      '<div style="position:relative;margin-top:9px;display:flex;align-items:center;gap:6px"><span style="width:16px;height:1px;background:#c9a227"></span>'+
        '<span style="width:19px;height:19px;background:#c9a227;transform:rotate(45deg);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(-45deg);font-family:Oswald;font-size:10px;font-weight:700;color:#12203c">'+no+'</span></span>'+
        '<span style="width:16px;height:1px;background:#c9a227"></span></div>'+
      '<div style="position:relative;margin-top:auto;width:100%;text-align:center">'+
        '<div class="nowrap" style="font-family:Oswald;font-size:'+ns+';font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff">'+nm+'</div>'+
        '<div style="font-size:5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#c9a227;margin-top:4px">'+pos+'</div></div>'+
     '</div></div></div>';

  if(d==='foil') return ''+
   '<div style="position:absolute;inset:0;background:#0b1020;padding:4px">'+
    '<div style="height:100%;position:relative;overflow:hidden;background:#0b1020">'+slot+

     '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.72) 0%,rgba(11,16,32,0) 34%,rgba(11,16,32,.1) 55%,rgba(11,16,32,.88) 100%)"></div>'+
     '<div style="position:absolute;top:9px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between"><span style="font-family:Oswald;font-size:9px;font-weight:700;letter-spacing:.26em;color:#fff">'+team+'</span><span style="font-size:5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:'+C+'">'+season+'</span></div>'+
     '<div style="position:absolute;right:8px;bottom:34px;font-family:Oswald;font-size:52px;font-weight:700;line-height:.78;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.85)">'+no+'</div>'+
     '<div style="position:absolute;left:0;right:0;bottom:0;padding:0 10px 10px"><span style="display:block;width:26px;height:2px;background:'+C+';margin-bottom:5px"></span>'+
       '<div class="nowrap" style="font-family:Oswald;font-size:'+ns+';font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff">'+nm+'</div>'+
       '<div style="font-size:5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:3px">'+pos+'</div></div>'+
    '</div></div>';

  if(d==='retro') return ''+
   '<div style="position:absolute;inset:0;background:#f6efe1"></div>'+
   '<div style="position:absolute;inset:0;background:radial-gradient(rgba(22,35,61,.16) 1px,rgba(0,0,0,0) 1.4px);background-size:5px 5px"></div>'+
   '<div style="position:absolute;inset:0;display:flex;flex-direction:column">'+
     '<div style="height:9px;background:'+C+'"></div><div style="height:5px;background:#e8552f"></div>'+
     '<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:11px 11px 0">'+
       '<div style="width:138px;height:132px;background:#dfd6c2;border:3px solid #16233d;overflow:hidden;position:relative">'+slot+
         '<div style="position:absolute;top:0;left:0;width:0;height:0;border-top:26px solid '+C+';border-right:26px solid transparent"></div></div>'+
       '<div style="position:relative;margin-top:-15px;width:100%;display:flex;align-items:center;gap:6px">'+
         '<div style="width:32px;height:32px;border-radius:50%;background:#e8552f;border:3px solid #f6efe1;display:flex;align-items:center;justify-content:center"><span style="font-family:Oswald;font-size:15px;font-weight:700;color:#fff">'+no+'</span></div>'+
         '<div style="flex:1;min-width:0;height:26px;background:#16233d;clip-path:polygon(0 0,100% 0,100% 100%,7px 100%,0 50%);display:flex;align-items:center;padding-left:12px">'+

   '<div style="position:absolute;top:0;bottom:0;left:19px;right:19px;background:#fff"></div>'+
   '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-bottom:8px">'+
     '<div style="width:100%;height:16px;background:#16233d;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px">'+
       '<span style="font-family:Oswald;font-size:8px;font-weight:700;letter-spacing:.2em">'+team+'</span><span class="dot"></span>'+
       '<span style="font-size:5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72)">'+season+'</span></div>'+
     '<div style="margin-top:6px;width:114px;height:138px;background:linear-gradient(160deg,#16233d 0%,#31456e 46%,#16233d 100%);clip-path:path(\'M 7.6,0 H 106.4 A 7.6,7.6 0 0 1 114,7.6 V 93 C 114,119 91,133 57,138 C 23,133 0,119 0,93 V 7.6 A 7.6,7.6 0 0 1 7.6,0 Z\');display:flex;justify-content:center;padding-top:3px">'+
       '<div style="width:108px;height:132px;position:relative;background:#dfe4ea;clip-path:path(\'M 7,0 H 101 A 7,7 0 0 1 108,7 V 89 C 108,113 87,127 54,132 C 21,127 0,113 0,89 V 7 A 7,7 0 0 1 7,0 Z\');overflow:hidden">'+slot+'</div></div>'+
     '<div style="margin-top:7px;width:20px;height:23px;background:#16233d;clip-path:path(\'M 3.5,0 H 16.5 A 3.5,3.5 0 0 1 20,3.5 V 14 C 20,19 16,21.5 10,23 C 4,21.5 0,19 0,14 V 3.5 A 3.5,3.5 0 0 1 3.5,0 Z\');display:flex;align-items:center;justify-content:center">'+
       '<span style="font-family:Oswald;font-size:6px;font-weight:700;color:#fff">'+team+'</span></div>'+
     '<div style="margin-top:auto;display:flex;align-items:center;gap:4px">'+
       '<div style="width:17px;height:17px;border-radius:50%;background:#16233d;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:9px;font-weight:700">'+no+'</div>'+
       '<div style="width:96px;height:17px;border-radius:999px;background:#fff;border:1px solid #16233d;display:flex;align-items:center;justify-content:center;padding:0 6px">'+
         '<span class="nowrap" style="font-family:Oswald;font-size:'+ns+';font-weight:600;text-transform:uppercase;color:#16233d;max-width:100%">'+nm+'</span></div></div>'+
   '</div>';
}

/* ---------- shared card back ---------- */
function back(p){
  var C='#7fc3e8', team=esc(S.team.teamName||'USA'), season=esc(S.team.season||'');
  var fact=(p.fact||'').trim();
  var staff=esc((S.team.coach||'—')+(S.team.assistant?' · Asst. '+S.team.assistant:''));
  var tag = p.isTeam ? 'Team card' : (/^\d+$/.test(String(p.no||'').trim()) ? 'No. '+esc(p.no) : 'No number yet');
  var list=S.players.map(function(r){
    return '<div style="display:grid;grid-template-columns:11px 1fr;gap:0 4px;align-items:baseline;padding:1px 0;border-bottom:1px solid rgba(22,35,61,.1);min-width:0">'+

/* ---------- data ---------- */
function loadAll(){
  var a=db.collection('soccer_players').where('accountId','==',accountId).get();
  var b=db.collection('soccer_team').doc(accountId).get();
  return Promise.all([a,b]).then(function(res){
    S.players=[];
    res[0].forEach(function(doc){ var d=doc.data(); d.id=doc.id; S.players.push(d); });
    S.players.sort(function(x,y){ return (x.order||0)-(y.order||0); });
    if(res[1].exists){ var t=res[1].data(); for(var k in t) S.team[k]=t[k]; }
    TEAM_PIN_HASH = DEFAULT_PIN_HASH;
  });
}
function saveTeam(){
  var t={accountId:accountId,teamName:S.team.teamName,season:S.team.season,coach:S.team.coach,assistant:S.team.assistant,photo:S.team.photo||''};
  return db.collection('soccer_team').doc(accountId).set(t);
}
function savePlayer(p){
  var d={accountId:accountId,name:p.name||'',no:p.no||'',position:p.position||'',fact:p.fact||'',design:p.design||'shield',photo:p.photo||'',filled:!!p.filled,order:p.order||0};
  if(p.id) return db.collection('soccer_players').doc(p.id).set(d);
  return db.collection('soccer_players').add(d).then(function(ref){ p.id=ref.id; });
}
function deletePlayer(p){ return p.id ? db.collection('soccer_players').doc(p.id).delete() : Promise.resolve(); }

/* photo: resize + compress to keep the doc under Firestore's 1MB limit */
function readPhoto(file, cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=520, w=img.width, h=img.height;
      var s=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var q=0.72, out=c.toDataURL('image/jpeg',q);
      while(out.length>700000 && q>0.35){ q-=0.1; out=c.toDataURL('image/jpeg',q); }
      cb(out);
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function renderPinGate(el, mode){
  el.innerHTML='<div class="gate">'+
    '<h1>'+(mode==='set'?'Set the team PIN':'Team PIN')+'</h1>'+
    '<div class="meta">'+(mode==='set'
      ? 'Pick a 4-digit PIN and share it with the parents. Only the scrambled version is stored — not the PIN itself.'
      : 'Enter the 4-digit PIN the coach gave you.')+'</div>'+
    '<input class="inp" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="----" '+
      'style="width:160px;margin:18px auto 0;text-align:center;letter-spacing:10px;font-size:20px" '+
      'onkeydown="if(event.key===\'Enter\')submitPin(\''+mode+'\')">'+
    '<div id="pin-err" style="color:#b23b3b;font-size:13px;min-height:20px;margin-top:8px"></div>'+
    '<button class="btn" onclick="submitPin(\''+mode+'\')">'+(mode==='set'?'Set PIN':'Unlock')+'</button>'+

  var i=document.getElementById('pin'); if(i) i.focus();
}

function submitPin(mode){
  var v=(document.getElementById('pin').value||'').trim();
  var err=document.getElementById('pin-err');
  if(!/^\d{4}$/.test(v)){ err.textContent='Enter 4 digits.'; return; }
  sha256(v).then(function(h){
    if(mode==='set'){
      TEAM_PIN_HASH=h;
      saveTeam().then(function(){ sessionStorage.setItem('soccer_pin_ok','1'); render(); });
    } else if(h===TEAM_PIN_HASH){
      sessionStorage.setItem('soccer_pin_ok','1'); init();
    } else {
      err.textContent='Wrong PIN.';
      document.getElementById('pin').value='';
    }
  });
}

function applyRoster(){
  var lines=document.getElementById('setup').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var kept=[], removals=[];
  lines.forEach(function(line,i){
    var m=line.match(/^(\d+)[\s,.\-]+(.+)$/);
    var no=m?m[1]:'', name=m?m[2]:line;
    var prev=S.players.filter(function(p){return p.name.toLowerCase()===name.toLowerCase();})[0];
    if(prev){ prev.no=no||prev.no; prev.order=i; kept.push(prev); }
    else kept.push({name:name,no:no,position:'',fact:'',design:'shield',photo:'',filled:false,order:i});
  });
  S.players.forEach(function(p){ if(kept.indexOf(p)===-1) removals.push(deletePlayer(p)); });
  S.players=kept;
  Promise.all(removals.concat(kept.map(savePlayer))).then(function(){ go('roster'); });
}

function deck(){
  var d=[{name:'Team '+(S.team.teamName||'USA'),no:'',isTeam:true,filled:true,photo:S.team.photo,design:'shield',position:'Team',meta:'Team card'}];
  S.players.filter(function(p){return p.filled;}).forEach(function(p){ d.push(p); });

function renderPack(el){
  var d=deck(), total=d.length, idx=((S.packIndex%total)+total)%total;
  var stack=d.map(function(c,i){
    var rel=(i-idx+total)%total, depth=Math.min(rel,5);
    var scale=rel===0?1.7:1.65-depth*0.03;
    var rot=rel===0?0:(i%2?1:-1)*depth*1.4;
    var st='left:'+(24+depth*16)+'px;top:'+(20+depth*10)+'px;transform:scale('+scale+') rotate('+rot+'deg);z-index:'+(rel===0?total:total-depth)+
      ';opacity:'+(rel>5?0:1)+';filter:drop-shadow(0 '+(rel===0?16:6)+'px '+(rel===0?26:12)+'px rgba(22,35,61,'+(rel===0?.3:.18)+'))';
    var side=(rel===0&&S.flipped)?'back':'front';
    return '<div style="position:absolute;'+st+'">'+cardHTML(c,side)+'</div>';
  }).join('');
  var cur=d[idx];
  el.innerHTML='<div class="cols"><div>'+
    '<h1>The pack</h1><div class="meta">Click the stack to deal through it · '+(idx+1)+' of '+total+'</div>'+
    '<div class="stack" style="margin-top:20px" onclick="nextCard()">'+stack+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:14px">'+
      '<button class="btn ghost" onclick="prevCard()">Back</button>'+
      '<button class="btn" onclick="nextCard()">Next card</button>'+
      '<button class="btn accent" onclick="flipCard()">Flip card</button></div></div>'+
    '<div style="width:280px;padding-top:14px">'+
      '<div style="font-family:Oswald;font-size:19px;font-weight:700;text-transform:uppercase">'+esc(cur.name)+'</div>'+
      '<div class="lab" style="margin-top:6px">'+esc(cur.isTeam?'Team card':(cur.position||'Player')+' · No. '+num(cur))+'</div>'+
      '<div style="height:1px;background:rgba(22,35,61,.15);margin:16px 0"></div>'+
      '<div style="font-size:13px;line-height:1.6;color:rgba(22,35,61,.7)">'+(total-1)+' player cards plus the team card. Cards join the pack as their parents fill them in.</div>'+
      '<div style="margin-top:16px"><button class="btn ghost" onclick="window.print()">Print the pack</button></div></div></div>';
}
function nextCard(){ S.packIndex++; S.flipped=false; render(); }
function prevCard(){ S.packIndex--; S.flipped=false; render(); }
function flipCard(){ S.flipped=!S.flipped; render(); }

/* ---------- boot ---------- */
function init(){
  if(!pinUnlocked()){ document.getElementById('tabs').innerHTML=''; renderPinGate(document.getElementById('app'),'enter'); return; }
  signIn().then(loadAll).then(render).catch(function(e){
    var msg=String((e&&e.message)||e), help='';
    if(/CONFIGURATION_NOT_FOUND|operation-not-allowed/i.test(msg))
      help='Turn on <b>Anonymous</b> sign-in: Firebase Console &rarr; Authentication &rarr; Sign-in method &rarr; Anonymous &rarr; Enable.';
    else if(/permission/i.test(msg))
      help='Publish the Firestore rules for <b>soccer_players</b> and <b>soccer_team</b>.';
    document.getElementById('app').innerHTML='<div class="gate"><h1>Couldn\'t load</h1>'+
      (help?'<div class="tip" style="text-align:left;margin-top:14px">'+help+'</div>':'')+
      '<div class="meta" style="margin-top:12px">'+esc(msg)+'</div></div>';
  });
}
init();
</script>

</body>
</html>
